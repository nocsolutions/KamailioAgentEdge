#!KAMAILIO
#
# KamailioAgentEdge - WebRTC agent edge / SBC (KEMI, Python routing)
#
# This is the bootstrap config. It contains ONLY what Kamailio needs before
# handing control to Python: globals, listen sockets, module load + modparam,
# and the cfgengine switch. All routing logic lives in kamailio.py (KEMI) -
# request_route, reply_route, the WS handshake and the auth/registrar/rtpengine
# flow are Python methods on the `kamailio` class there.
#
# Role in the fleet:
#   agent browser (ViciPhone/JsSIP)
#        | WSS  (SIP over WebSocket over TLS, DTLS-SRTP media)
#        v
#   THIS EDGE  - registrar (usrloc) + digest auth (auth_db) + media anchor (rtpengine)
#        | UDP  (plain SIP, plain RTP)
#        v
#   av*/pd* Asterisk (chan_sip webphone peers rewritten to host=<edge>)
#
# The edge is the registrar because chan_sip on the Asterisk-11 fleet has no
# Path support, so Asterisk can never route back to a ws: contact through us.
# Digest credentials (ext / phone_pass) are mirrored read-only from each
# cluster's VICIdial `phones` into the local `subscriber` table by
# tools/sync_subscribers.py - the login service is never touched.
#
# Deliberately NOT enabled (call out here so nobody goes looking):
#   - transcoding       rtpengine bridges transports only; codecs (ulaw/opus)
#                       negotiate end to end, media stays kernel-forwarded.
#   - dispatcher LB     agent->box uses the R-URI the client already carries;
#                       box->agent uses usrloc. No load balancing on this box.
#   - presence / dialog no CDR/dialog tracking here (the border owns that).

####### Defined Values #########

# per-transaction (message) flags
#!define FLT_NATS 5

# per-branch (contact) flags
#!define FLB_NATB 6
#!define FLB_NATSIPPING 7

####### Local overrides #########
#
# Environment-specific values and secrets live in kamailio-local.cfg, which is
# NOT in version control - ship kamailio-local.cfg.example instead. import_file
# tolerates it being absent; every value below is #!trydef so a definition in
# the local file wins and these apply only as fallback. The include must come
# first for that ordering to hold.
import_file "kamailio-local.cfg"

# --- listen sockets (override in kamailio-local.cfg) ---
# PUB = public, agent-facing (WSS + rtpengine public media)
# INT = internal, Asterisk-facing (plain SIP/RTP toward the dialers)
# NOTE: bare tokens (no quotes) - they are text-substituted into listen= lines.
#!trydef PUB_IP 216.66.20.147
#!trydef INT_IP 10.4.100.147
#!trydef WSS_PORT 4443

# --- database (secret: real password belongs in kamailio-local.cfg) ---
# Quoted: substituted into modparam() string arguments.
#!trydef DBURL "mysql://kamailio:SET-IN-kamailio-local.cfg@localhost/kamailio"

# --- rtpengine ng control socket (local daemon) ---
#!trydef RTPENGINE_SOCK "udp:127.0.0.1:2223"

# The digest realm (AUTH_REALM) and the trs address group (TRS_GROUP) are used
# only by the KEMI script - see the constants at the top of kamailio.py. KEMI
# cannot read cfg defines, so they are set there, not here.

####### Global Parameters #########

/* LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR */
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

memdbg=5
memlog=5

/* Agent-facing WSS and the internal Asterisk leg. The public socket advertises
   its own address so Contacts/Record-Route the client and Asterisk see are
   reachable. */
listen=udp:INT_IP:5060 advertise INT_IP:5060
listen=tls:PUB_IP:WSS_PORT advertise PUB_IP:WSS_PORT

children=8

/* WebSocket lives on TCP/TLS; keep the connections up. */
tcp_connection_lifetime=3604
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384
enable_tls=yes

auto_aliases=no
enable_sctp=no

####### Modules Section ########

# RPC / control plane (kamcmd, kamctl)
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "counters.so"

# core SIP processing
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "xlog.so"

# database
loadmodule "db_mysql.so"

# registrar + location
loadmodule "usrloc.so"
loadmodule "registrar.so"

# digest auth against the mirrored subscriber table
loadmodule "auth.so"
loadmodule "auth_db.so"

# source-IP allowlist for the Asterisk leg (trs set)
loadmodule "permissions.so"

# flood / scanner protection on the public socket
loadmodule "htable.so"
loadmodule "pike.so"

# WebRTC transport: TLS + WebSocket + the HTTP upgrade handler + NAT helpers
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "nathelper.so"

# dialog tracking - gives us a guaranteed teardown hook and, just as importantly,
# lets the CANCEL path tell a live established call from an orphaned offer.
loadmodule "dialog.so"

# media anchoring
loadmodule "rtpengine.so"

# KEMI - routing logic is Python (kamailio.py)
loadmodule "app_python3.so"

# ----------------- module parameters ---------------

# ----- jsonrpcs / ctl -----
modparam("jsonrpcs", "pretty_format", 1)

# ----- tm -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# ----- rr -----
# Add the ;lr param and keep the from-tag out of RR - standard for a proxy that
# record-routes dialog-forming requests through both transports.
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 0)

# ----- sanity -----
modparam("sanity", "autodrop", 0)

# ----- usrloc -----
# db_mode 1 = write-through: registrations survive a restart (important, an
# agent mid-shift should not have to re-register because we bounced kamailio).
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 1)
# Key AoRs on username only. Extensions are globally unique across the fleet
# (login.avatar.tech allocates from one pool), and the webphone's To-domain is
# not something we control, so domain-agnostic keying is both simpler and more
# robust. auth_db and registrar follow the same convention below.
modparam("usrloc", "use_domain", 0)
# A webphone contact is reachable only over the exact WebSocket it registered on
# (chan_sip has no Path, so the edge holds the connection). When that socket
# dies, a contact left in the table is a black hole: lookup() resolves it, tm
# tries to send, and the branch fails with "TCP/TLS connection for WebSocket
# could not be found" - so every call to that agent is swallowed until the
# registration expires. Reproduced by killing a registered client: the contact
# kept pointing at the dead Tcpconn-Id for the rest of its 300s.
# handle_lost_tcp drops the contact with its connection, so the agent reads as
# Not Registered (the dialer gets 404 and moves on) instead of eating calls.
# Browsers crash, laptops sleep and wifi flaps - this is the common case.
modparam("usrloc", "handle_lost_tcp", 1)
# The mirror of it: when a contact expires, close the socket it was pinned to
# instead of leaving an orphan connection against the fd budget.
modparam("usrloc", "close_expired_tcp", 1)

# ----- registrar -----
# One contact per AoR (a webphone is a single station); default expiry tuned so
# re-REGISTER churn is modest but dead contacts clear within a couple minutes.
modparam("registrar", "max_contacts", 1)
modparam("registrar", "default_expires", 300)
modparam("registrar", "min_expires", 60)
modparam("registrar", "gruu_enabled", 0)
# (registrar has no use_domain param; it follows usrloc's use_domain=0 above.)

# ----- auth_db -----
# Credentials are mirrored as cleartext phone_pass, so compute ha1 on the fly
# with the edge realm. load_credentials empty = do not export extra AVPs.
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "user_column", "username")
modparam("auth_db", "password_column", "password")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "use_domain", 0)
modparam("auth_db", "load_credentials", "")

# ----- permissions (trs source allowlist) -----
modparam("permissions", "db_url", DBURL)
modparam("permissions", "peer_tag_avp", "$avp(peer_tag)")

# ----- pike (flood) -----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 40)
modparam("pike", "remove_latency", 4)

# ----- htable (scanner marks) -----
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")

# ----- tls -----
modparam("tls", "config", "/etc/kamailio/tls.cfg")

# ----- nathelper -----
# ping registered WS contacts so the TCP/TLS socket and NAT binding stay open.
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 0)
modparam("nathelper", "sipping_bflag", FLB_NATSIPPING)
modparam("nathelper", "sipping_from", "sip:pinger@avatar.tech")

# ----- dialog -----
# Route dialog lifecycle events to KEMI (ksr_dialog_event gets "dialog:start",
# "dialog:end", "dialog:failed").
modparam("dialog", "event_callback", "ksr_dialog_event")
# Memory only: a kamailio restart drops every WebSocket anyway (SIP.js is
# configured reconnectionAttempts=0), so persisting dialogs across a restart
# would only resurrect calls whose signalling path is already gone.
modparam("dialog", "db_mode", 0)
# 12h. An agent sits in a MeetMe conference for a whole shift, so this must not
# be a "call length" limit - it is only a backstop against a dialog that never
# sees a BYE. rtpengine's own timeouts (rtpengine.conf) reap the media far
# sooner; this reaps the dialog bookkeeping.
modparam("dialog", "default_timeout", 43200)
# Keep dialog state correct across re-INVITEs (hold/resume).
modparam("dialog", "track_cseq_updates", 1)

# ----- rtpengine -----
modparam("rtpengine", "rtpengine_sock", RTPENGINE_SOCK)
# Return a disabled node from the pin on the delete path (see the border notes):
# a query that times out marks the node disabled in shared memory, and only
# allow_op==1 lets the matching delete still reach it, so sessions do not leak.
modparam("rtpengine", "rtpengine_allow_op", 1)

# Required for the teardown after a FAILED offer to reach the daemon.
# When an offer times out, the node is marked disabled and NO hash entry exists
# for the call-id, so select_rtpp_node_old() misses and select_rtpp_node_new()
# returns NULL at rtpengine.c:4775 - before the rtpengine_allow_op block at
# :4942 is ever consulted (allow_op only helps when a node was already found,
# which is why the BYE/CANCEL deletes work but this one would not). With
# aggressive_redetection the node is force-pinged and the delete lands, so the
# port pair is released instead of being pinned until silent-timeout.
modparam("rtpengine", "aggressive_redetection", 1)

# ----- websocket / xhttp: dispatch their event routes to Python (KEMI) -----
modparam("xhttp", "event_callback", "ksr_xhttp_event")
modparam("websocket", "event_callback", "ksr_websocket_event")
# How long a silent WebSocket may sit before it is pinged and, failing that,
# closed. This bounds how long handle_lost_tcp (see usrloc) takes to notice a
# browser that vanished WITHOUT closing the socket - a slept laptop or a dropped
# wifi link sends no FIN, so nothing tells the edge until a ping goes unanswered.
# Until then the agent still holds a contact and absorbs calls. The default 180s
# is up to three minutes of an agent silently eating the queue; 60s costs one
# ping frame per idle connection per minute, which is nothing next to ~700
# agents' normal SIP traffic. An abrupt close (crash, tab closed) still RSTs and
# is caught immediately, independent of this.
modparam("websocket", "keepalive_timeout", 60)

# ----- app_python3 (KEMI) -----
modparam("app_python3", "load", "/etc/kamailio/kamailio.py")

####### KEMI fixup shim ########
#
# With cfgengine "python" the native routes below never execute, but the config
# is still parsed and function fixups still run at load. registrar/usrloc only
# register the "location" usrloc domain through the save()/lookup() fixup - which
# in pure KEMI would never fire - so this unreachable route exists solely to
# trigger it. Without it, KSR.registrar.save("location") fails at runtime with
# "usrloc domain [location] not found" (kamailio issue #1972).
route[KEMI_FIXUP] {
	save("location");
	lookup("location");
}

# Hand all routing to Python. Everything past this point is in kamailio.py.
cfgengine "python"
