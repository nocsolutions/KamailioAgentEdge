# TLS config for the agent-facing WSS listener.
#
# For a pilot, deploy/gen_selfsigned_cert.sh drops a self-signed pair at the
# paths below (browsers will warn - fine for sipp/lab, not for real agents).
# For production, point private_key/certificate at the real cert for the edge
# FQDN (agents connect to wss://<edge-fqdn>:4443) and ship the full chain in
# ca_list. Keep the real key out of git.

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/edge-key.pem
certificate = /etc/kamailio/tls/edge-cert.pem
# ca_list = /etc/kamailio/tls/chain.pem
cipher_list = HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
