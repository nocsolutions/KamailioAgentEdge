[rtpengine]
# Agent-edge media anchor. Two interfaces:
#   pub - public, faces the agent browsers (ICE candidates, DTLS-SRTP)
#   int - internal, faces the av*/pd* Asterisk boxes (plain RTP)
# The KEMI script selects them with `direction=pub direction=int` (and the
# reverse) in the rtpengine offer flags.
interface = pub/216.66.20.147;int/10.4.100.147

# ng control protocol - kamailio's rtpengine module talks here (RTPENGINE_SOCK).
listen-ng = 127.0.0.1:2223

# Media port range on both interfaces. 30k ports = ~15k concurrent streams,
# far above the ~700-agent peak.
port-min = 30000
port-max = 40000

# Kernel forwarding via the xt_RTPENGINE table (installed by rtpengine-iptables
# / the DKMS module). Passthrough calls never touch userspace.
table = 0

# DTLS: rtpengine terminates DTLS-SRTP toward the browser as the passive side
# (DTLS=passive in the KEMI flags); it auto-generates a self-signed DTLS cert.
# No transcoding is configured - codecs negotiate end to end.

timeout = 60
silent-timeout = 3600
final-timeout = 10800
delete-delay = 0

log-level = 6
log-facility = local1
