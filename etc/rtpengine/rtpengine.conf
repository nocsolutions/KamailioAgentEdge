[rtpengine]
# Agent-edge media anchor. Two interfaces:
#   pub - public, faces the agent browsers (ICE candidates, DTLS-SRTP)
#   int - internal, faces the av*/pd* Asterisk boxes (plain RTP)
# The KEMI script selects them with `direction=pub direction=int` (and the
# reverse) in the rtpengine offer flags.
interface = pub/216.66.20.147;int/10.4.100.147

# ng control protocol - kamailio's rtpengine module talks here (RTPENGINE_SOCK).
listen-ng = 127.0.0.1:2223

# CLI control socket for rtpengine-ctl (session inspection, ops).
listen-cli = 127.0.0.1:9900

# Media port range on both interfaces. 10001 ports = 5000 pairs, and a bridged
# call consumes a pair PER SIDE, so this is ~2500 concurrent calls - not the
# "15k streams" an earlier version of this comment claimed. Still comfortably
# above the ~700-agent peak, but it is the number to watch when sizing.
port-min = 30000
port-max = 40000

# Kernel forwarding via the xt_RTPENGINE table (installed by rtpengine-iptables
# / the DKMS module). Passthrough calls never touch userspace.
table = 0

# DTLS: rtpengine terminates DTLS-SRTP toward the browser as the passive side
# (DTLS=passive in the KEMI flags); it auto-generates a self-signed DTLS cert.
# No transcoding is configured - codecs negotiate end to end.

# Reaper timeouts. These are the safety net for any session the SIP layer fails
# to delete, so they must be short enough to matter on a predictive dialer, which
# generates far more unanswered than answered calls.
#
#   timeout        had media, then went silent
#   silent-timeout answered but media never flowed (e.g. DTLS never completed)
#   offer-timeout  offered but never answered - the orphan class produced by a
#                  failed offer, or by a CANCEL that arrives with no matching
#                  transaction (see the CANCEL branch in kamailio.py, which
#                  deliberately does not delete there: it cannot tell an
#                  orphaned offer from a live established call, and deleting
#                  would kill working audio).
#
# offer-timeout was previously UNSET, so the daemon default of 3600 applied and
# an orphan pinned a port pair for a full hour. 180s keeps the net tight while
# staying above tm's fr_inv_timer (120s) plus margin - go below that and a call
# that is still legitimately ringing loses its media anchor.
#
# All four can be changed live, with no restart and no audio interruption:
#   rtpengine-ctl set offertimeout 180 ; rtpengine-ctl list offertimeout
# Restarting rtpengine instead would drop every in-progress call.
timeout = 60
silent-timeout = 180
offer-timeout = 180
final-timeout = 10800
delete-delay = 0

log-level = 6
log-facility = local1
